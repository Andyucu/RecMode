name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # NOTE: this job doesn't actually run the test suite (413 tests as of 0.9.72-beta). `tests/` is intentionally
  # excluded from version control (see CLAUDE.md's standing "never stage/commit" list), so it doesn't exist in
  # this checkout at all — RecMode.slnx (the committed solution) has no test projects for the same reason
  # (RecMode.local.slnx, also untracked, is what a local dev build/test run actually uses). The suite is run
  # locally via ./build.ps1 before every release, but nothing here enforces that - this workflow has no test
  # gate of its own and only builds+packages what's actually pushed.
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore RecMode.slnx

      - name: Build (Release, warnings as errors)
        run: >
          dotnet build RecMode.slnx -c Release --no-restore
          -p:TreatWarningsAsErrors=true -p:EnforceCodeStyleInBuild=true

      - name: Format check (advisory)
        if: always()
        run: dotnet format RecMode.slnx --verify-no-changes --no-restore
        continue-on-error: true

      - name: Dependency vulnerability audit
        shell: pwsh
        run: |
          # `dotnet list package --vulnerable` always exits 0 — it's a reporting tool, not a gate — so this
          # step used to stay green on CI regardless of what it actually printed. In --vulnerable mode the CLI
          # only lists packages that ARE vulnerable (a clean dependency tree reports none at all under
          # top/transitivePackages), so a non-empty list here is unambiguous; --format json makes that
          # machine-checkable instead of scraping the human-readable table.
          $json = dotnet list RecMode.slnx package --vulnerable --include-transitive --format json | Out-String
          $data = $json | ConvertFrom-Json
          $vulnerable = @()
          foreach ($project in $data.projects) {
            foreach ($framework in $project.frameworks) {
              if ($framework.topLevelPackages) { $vulnerable += $framework.topLevelPackages }
              if ($framework.transitivePackages) { $vulnerable += $framework.transitivePackages }
            }
          }
          if ($vulnerable.Count -gt 0) {
            Write-Host "::error::Vulnerable package(s) found:"
            $vulnerable | ForEach-Object { Write-Host "  $($_.id) $($_.resolvedVersion)" }
            exit 1
          }
          Write-Host "No vulnerable packages found."

      - name: Portable packaging smoke test
        shell: pwsh
        run: |
          # Must match the actual shipped publish invocation (release.yml / publish-portable.ps1) - self-
          # contained, win-x64, R2R, RecModePortable=true. The previous version of this step published
          # framework-dependent with none of those switches, so it could never have caught an R2R/crossgen
          # failure, a missing win-x64-specific asset, or a broken `portable.marker` glob (which would make a
          # shipped build silently write to %APPDATA%/%USERPROFILE%\Videos instead of .\Data\.\Recordings) -
          # any of those would pass this step green and first surface in release.yml or in a user's hands.
          dotnet publish src/RecMode.App/RecMode.App.csproj -c Release -r win-x64 --self-contained true `
            -p:PublishReadyToRun=true -p:RecModePortable=true -o artifacts/portable-smoke
          if (-not (Test-Path artifacts/portable-smoke/RecMode.exe)) {
            throw "Portable build did not produce RecMode.exe"
          }
          if (-not (Test-Path artifacts/portable-smoke/portable.marker)) {
            throw "Portable build did not produce portable.marker - AppPaths would resolve to %APPDATA% instead of .\Data, breaking the portable-first guarantee."
          }
